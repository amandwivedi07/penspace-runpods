# Build the render image on GitHub's amd64 runners and push it to GHCR.
#
# Why here and not on a laptop: the image is amd64 + CUDA, and building it on an
# Apple Silicon machine means QEMU emulation of a multi-gigabyte torch install —
# hours, on a machine that cannot run the result anyway. Why not on a pod: a pod
# bills by the second while it builds, and pods cannot run Docker inside
# themselves.
#
# The image this produces is what a POD should run. Do not bootstrap a bare pod
# and install the stack by hand; that path produced a CUDA/cuDNN mismatch that
# left a 4090 at a quarter of its throughput while still reporting CUDA as
# available.
name: render image

on:
  workflow_dispatch:
  push:
    branches: [main, feat/per-job-language]
    paths:
      - "penspace/**"
      - ".github/workflows/render-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR rather than Docker Hub: the token already exists, there is no rate
      # limit on pulls from a private repo you own, and no second account to
      # keep credentials for.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: penspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/render:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/render:${{ github.sha }}
          # Layer cache in the registry: the torch install is the expensive step
          # and almost never changes, so later builds take minutes not an hour.
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.repo }}/render:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.repo }}/render:buildcache,mode=max

      - name: how to use it
        run: |
          echo "Image: ghcr.io/${{ steps.meta.outputs.repo }}/render:latest"
          echo
          echo "Deploy a RunPod pod with that as its Container Image, then inside it:"
          echo "  python -m penspace.cli doctor      # 60s — is the GPU real?"
          echo "  python -m penspace.worker --api <backend>/api --token <AUDIO_WORKER_TOKEN>"
          echo
          echo "Mount a volume at /models so weights download once, not per pod."
